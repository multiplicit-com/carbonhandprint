title: Carbon Handprint
tagline: The positive side of your carbon footprint
description: >-
  Carbon Handprint is an open idea: alongside measuring the damage we do,
  recognise and grow the positive difference we make for the climate.
url: "https://carbonhandprint.org"
baseurl: ""
lang: en-GB
logo: /android-chrome-192x192.png
social:
  name: Carbon Handprint
timezone: Europe/London

permalink: /blog/:year/:month/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: default, image: /assets/images/share.png }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
