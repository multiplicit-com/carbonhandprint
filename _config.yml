title: Carbon Handprint
tagline: The positive side of your carbon footprint
description: >-
  Carbon Handprint is an open idea: recognise and grow the positive
  difference we make for the climate.
url: "https://carbonhandprint.org"
baseurl: ""
lang: en-GB
facebook_url: https://www.facebook.com/CarbonHandprint/
logo: /android-chrome-192x192.png
social:
  name: Carbon Handprint
  links:
    - https://www.facebook.com/CarbonHandprint/
timezone: Europe/London
author: editors

permalink: /articles/:year/:month/:title/

feed:
  path: feed.xml

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  news:
    output: false

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, author: editors, seo: { type: Article } }
  - scope: { path: "" }
    values: { layout: default, image: /assets/images/share.png }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
