    upcoming: true
    page: /events/cop32/

eu:
  name: European Union
  region: Europe
  accent: blue
  lede: Negotiates as one bloc and makes a joint pledge for all its member states.
  cat_url: https://climateactiontracker.org/countries/eu/
  cat_date: August 2026
  rating: Insufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Cut net emissions at least 55% below 1990 levels by 2030, and 66.25 to 72.5% by 2035.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/eu/
  - label: Net zero
    text: 2050, set in law by the European Climate Law, with a 2040 target of a 90% cut.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/eu/
  - label: Independent rating
    text: Climate Action Tracker rates the EU's overall action "Insufficient" (August 2026).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/eu/
  - label: Recent
    text: The EU agreed a 2040 target of a 90% cut in late 2025. It has also weakened several policies, including the 2035 phase-out of new petrol and diesel cars, and will let international carbon credits count toward the 2040 target.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/eu/
  timeline:
  - when: November 2025
    date: 2025-11
    text: Submits its 2035 pledge, a cut of 66.25 to 72.5% below 1990 levels.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/eu/
  - when: July 2021
    date: 2021-07
    text: The European Climate Law comes into force, making climate neutrality by 2050 legally binding.
    source: European Commission
    url: https://climate.ec.europa.eu/eu-action/european-climate-law_en
  - when: April 2026
    date: 2026-04
