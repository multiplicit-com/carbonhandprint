# Country pages. Each key needs a matching file in countries/ (copy one and change `country:`).
# Tag content with `countries: [key]` in front matter (articles, news).
# region groups the list on the Paris Agreement page. part_of links a member state to a bloc (eu).
# cat_url, cat_date and rating come from the Climate Action Tracker country page; cat_date is the date of its latest assessment.
# facts: label, text, source (short name), url. Use authoritative sources only, and update `checked`.


argentina:
  name: Argentina
  region: Americas
  accent: orange
  lede: A 2030 cap on emissions, but no 2035 pledge yet and its climate agencies were dissolved in 2026.
  cat_url: https://climateactiontracker.org/countries/argentina/
  cat_date: July 2026
  rating: Highly insufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Keep net emissions below 349 million tonnes of CO2 equivalent (MtCO2e) in 2030 (updated 2021). No 2035 pledge has been submitted.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/argentina/
  - label: Net zero
    text: 2050, set out in a long-term strategy submitted to the UN in 2022.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/argentina/
  - label: Independent rating
    text: Climate Action Tracker rates Argentina's overall action "Highly insufficient" (July 2026). CAT says the move up from "Critically insufficient" reflects revised emissions data, not new action.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/argentina/
  - label: Recent
    text: In April 2026 the government dissolved its national climate change directorates. The 2035 pledge is overdue.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/argentina/

australia:
  name: Australia
  region: Oceania
  accent: green
  lede: Targets set in law since 2022, while coal and gas projects continue to be approved.
  cat_url: https://climateactiontracker.org/countries/australia/
  cat_date: November 2026
  rating: Insufficient
  checked: November 2026
  facts:
  - label: Paris Agreement
    text: A party since 2016.
  - label: Pledge (NDC)
    text: Cut net emissions 62 to 70% below 2005 levels by 2035, and 43% by 2030.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/australia/
  - label: Net zero
    text: 2050, set in law by the Climate Change Act 2022.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/australia/
  - label: Independent rating
    text: Climate Action Tracker rates Australia's overall action "Insufficient" (November 2026).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/australia/
  - label: Recent
    text: A 2025 Net Zero Plan added interim targets and sector plans, and a vehicle efficiency standard took effect in 2025. At least 37 new or expanded coal and gas projects have been approved, with 40 or more awaiting a decision.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/australia/

bhutan:
  name: Bhutan
  region: Asia
  accent: plum
  lede: Already carbon neutral, with forests that absorb more carbon than the country emits.
  cat_url: https://climateactiontracker.org/countries/bhutan/
  cat_date: July 2023
  rating: Almost sufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Stay carbon neutral. In 2020 the country was a net carbon sink of 8.9 MtCO2e.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/bhutan/
  - label: Net zero
    text: Its second pledge extends carbon neutrality to all greenhouse gases by 2050.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/bhutan/
  - label: Independent rating
    text: Climate Action Tracker rates Bhutan's overall action "Almost sufficient" (July 2023). CAT uses an adapted method because Bhutan is already carbon neutral.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/bhutan/
  - label: Recent
    text: Delays to hydropower projects are adding to national debt, and its first large solar plant (17 MW) was due to start construction in 2023.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/bhutan/

brazil:
  name: Brazil
  region: Americas
  accent: orange
  lede: Host of COP30 in 2025, with a 2035 pledge but new oil drilling approved in the Amazon basin.
  cat_url: https://climateactiontracker.org/countries/brazil/
  cat_date: June 2026
  rating: Highly insufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Cut net emissions 59 to 67% below 2005 levels by 2035.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/brazil/
  - label: Net zero
    text: Climate neutrality by 2050, stated in its pledge.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/brazil/
  - label: Independent rating
    text: Climate Action Tracker rates Brazil's overall action "Highly insufficient" (June 2026). Down from "Insufficient".
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/brazil/
  - label: Recent
    text: Amazon deforestation fell 31% in 2024. At the end of 2025 a new environmental licensing law, dubbed the "Devastation Bill", passed and oil drilling in the Amazon basin was approved.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/brazil/

canada:
  name: Canada
  region: Americas
  accent: orange
  lede: Net zero by 2050 is in law, but several major climate policies have been reversed since 2025.
  cat_url: https://climateactiontracker.org/countries/canada/
  cat_date: October 2026
  rating: Highly insufficient
  checked: November 2026
  facts:
  - label: Paris Agreement
    text: A party since 2016.
  - label: Pledge (NDC)
    text: Cut emissions 45 to 50% below 2005 levels by 2035 (submitted February 2025), and 40 to 45% by 2030.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/canada/
  - label: Net zero
    text: 2050, set in law by the Net-Zero Emissions Accountability Act 2021.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/canada/
  - label: Independent rating
    text: Climate Action Tracker rates Canada's overall action "Highly insufficient" (October 2026).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/canada/
  - label: Recent
    text: The federal government has scrapped the consumer carbon price, the planned oil and gas emissions cap and the electric vehicle sales mandate.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/canada/

chile:
  name: Chile
  region: Americas
  accent: orange
  lede: Net zero by 2050 is legally binding, and the coal phase-out may come forward to 2035.
  cat_url: https://climateactiontracker.org/countries/chile/
  cat_date: November 2025
  rating: Almost sufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Limit emissions to 95 MtCO2e in 2030.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/chile/
  - label: Net zero
    text: 2050, legally binding under its Framework Law on Climate Change.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/chile/
  - label: Independent rating
    text: Climate Action Tracker rates Chile's overall action "Almost sufficient" (November 2025).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/chile/
  - label: Recent
    text: President Boric announced plans to bring the coal phase-out forward to 2035 or earlier, depending on the grid. New energy projects must now be checked against the climate law.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/chile/

china:
  name: China
  region: Asia
  accent: plum
  lede: The world's largest emitter, whose emissions may have peaked in 2025.
  cat_url: https://climateactiontracker.org/countries/china/
  cat_date: November 2026
  rating: Highly insufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Cut net greenhouse gas emissions 7 to 10% from their peak by 2035.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/china/
  - label: Net zero
    text: Carbon neutrality before 2060, announced in 2020.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/china/
  - label: Independent rating
    text: Climate Action Tracker rates China's overall action "Highly insufficient" (November 2026).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/china/
  - label: Recent
    text: CAT estimates emissions may have peaked in 2025 at 15.6 billion tonnes CO2e. The 15th Five-Year Plan (March 2026) targets a 17% cut in carbon intensity by 2030, which CAT calls conservative.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/china/

colombia:
  name: Colombia
  region: Americas
  accent: orange
  lede: Has granted no new oil and gas exploration licences since 2022.
  cat_url: https://climateactiontracker.org/countries/colombia/
  cat_date: November 2025
  rating: Insufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: A pledge updated in September 2025 confirms the 2030 target and sets a slightly stronger goal for 2035.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/colombia/
  - label: Net zero
    text: 2050, in a long-term strategy submitted in 2021, backed by a 2021 climate law.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/colombia/
  - label: Independent rating
    text: Climate Action Tracker rates Colombia's overall action "Insufficient" (November 2025).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/colombia/
  - label: Recent
    text: No new oil and gas exploration licences have been granted since 2022, and a ban on fracking is going through. CAT says the pledge to phase out fossil fuels led to a credit rating downgrade.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/colombia/

costa-rica:
  name: Costa Rica
  region: Americas
  accent: orange
  lede: A national plan to decarbonise by 2050, but the government now wants to explore for oil and gas.
  cat_url: https://climateactiontracker.org/countries/costa-rica/
  cat_date: November 2024
  rating: Almost sufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Net emissions of no more than 9.11 MtCO2e in 2030, including land use.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/costa-rica/
  - label: Net zero
    text: 2050, under its National Decarbonisation Plan.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/costa-rica/
  - label: Independent rating
    text: Climate Action Tracker rates Costa Rica's overall action "Almost sufficient" (November 2024). Ratings are from CAT's 2023 evaluation.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/costa-rica/
  - label: Recent
    text: President Chaves opposes a proposed oil moratorium and wants to explore fossil fuel reserves. Electric public transport projects have been paused or scaled back.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/costa-rica/

egypt:
  name: Egypt
  region: Africa
  accent: mustard
  lede: Host of COP27 in 2022, with no net zero target and new investment in gas.
  cat_url: https://climateactiontracker.org/countries/egypt/
  cat_date: October 2025
  rating: Highly insufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Conditional cuts against business as usual in electricity, transport, and oil and gas only, plus 42% renewable electricity by 2030. No economy-wide target.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/egypt/
  - label: Net zero
    text: None.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/egypt/
  - label: Independent rating
    text: Climate Action Tracker rates Egypt's overall action "Highly insufficient" (October 2025).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/egypt/
  - label: Recent
    text: The government has committed US$7.2 billion to new gas exploration. Renewables supplied 11% of electricity in 2024.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/egypt/

ethiopia:
  name: Ethiopia
  region: Africa
  accent: mustard
  lede: The first country to ban imports of petrol and diesel cars.
  cat_url: https://climateactiontracker.org/countries/ethiopia/
  cat_date: May 2025
  rating: Almost sufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Cut emissions 68.8% below business as usual by 2030, mostly conditional on international support.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/ethiopia/
  - label: Net zero
    text: 2050, in its long-term strategy (2023). Not yet in law.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/ethiopia/
  - label: Independent rating
    text: Climate Action Tracker rates Ethiopia's overall action "Almost sufficient" (May 2025).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/ethiopia/
  - label: Recent
    text: In 2024 Ethiopia banned imports of combustion engine vehicles and removed import taxes on electric vehicles.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/ethiopia/

eu:
  name: European Union
  region: Europe
  accent: blue
  lede: Negotiates as one bloc and makes a joint pledge for all its member states.
  cat_url: https://climateactiontracker.org/countries/eu/
  cat_date: August 2026
  rating: Insufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Cut net emissions at least 55% below 1990 levels by 2030, and 66.25 to 72.5% by 2035.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/eu/
  - label: Net zero
    text: 2050, set in law by the European Climate Law, with a 2040 target of a 90% cut.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/eu/
  - label: Independent rating
    text: Climate Action Tracker rates the EU's overall action "Insufficient" (August 2026).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/eu/
  - label: Recent
    text: The EU adopted its 2040 target in 2025. It has also weakened several policies, including the 2035 phase-out of new petrol and diesel cars, and will let international carbon credits count toward the 2040 target.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/eu/

finland:
  name: Finland
  region: Europe
  accent: blue
  lede: Home of the VTT and LUT handprint method, with a legal target of carbon neutrality by 2035.
  part_of: eu
  checked: November 2026
  facts:
  - label: Paris Agreement
    text: A party, with its pledge made jointly through the European Union.
  - label: Climate law
    text: The Climate Change Act, in force since 1 July 2022, sets carbon neutrality by 2035, emissions targets for 2030 and 2040, and a target to strengthen carbon sinks.
    source: Parliament of Finland
    url: https://www.eduskunta.fi/EN/tiedotteet/Pages/Parliament-passed-a-New-Climate-Change-Act.aspx
  - label: Handprint
    text: VTT and LUT University developed the carbon handprint method with Finnish companies including Nokia, Neste and KONE.
    source: handprint.fi
    url: https://handprint.fi/

gambia:
  name: The Gambia
  region: Africa
  accent: mustard
  lede: A small emitter whose unconditional pledge CAT rates as a fair share for 1.5 °C.
  cat_url: https://climateactiontracker.org/countries/gambia/
  cat_date: February 2023
  rating: Almost sufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: CAT rates its unconditional target "1.5 °C compatible" against its fair share.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/gambia/
  - label: Net zero
    text: Climate neutral by 2050, in a long-term strategy (2022) that covers 81% of its emissions.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/gambia/
  - label: Independent rating
    text: Climate Action Tracker rates The Gambia's overall action "Almost sufficient" (February 2023).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/gambia/
  - label: Recent
    text: It continues to promote oil and gas extraction to cut its fuel imports.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/gambia/

germany:
  name: Germany
  region: Europe
  accent: blue
  lede: Europe's largest economy, with net zero by 2045 in law.
  part_of: eu
  cat_url: https://climateactiontracker.org/countries/germany/
  cat_date: August 2026
  rating: Insufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Germany's pledge is made jointly through the EU. Its own law targets a cut of at least 65% below 1990 levels by 2030.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/germany/
  - label: Net zero
    text: 2045, set in law in 2021.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/germany/
  - label: Independent rating
    text: Climate Action Tracker rates Germany's overall action "Insufficient" (August 2026).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/germany/
  - label: Recent
    text: Parliament approved 9 GW of new gas power by 2031, and the government is dropping its electric car sales target and the 2035 phase-out of combustion engine cars. A new income-linked subsidy for electric cars began in January 2026.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/germany/

india:
  name: India
  region: Asia
  accent: plum
  lede: Fast-growing clean power alongside rising demand, with net zero set for 2070.
  cat_url: https://climateactiontracker.org/countries/india/
  cat_date: September 2026
  rating: Highly insufficient
  checked: November 2026
  facts:
  - label: Paris Agreement
    text: A party since 2016.
  - label: Pledge (NDC)
    text: Submitted April 2026. Cut the emissions intensity of GDP 47% below 2005 levels and reach 60% non-fossil power capacity by 2035.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/india/
  - label: Net zero
    text: 2070, announced at COP26 in 2021.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/india/
  - label: Independent rating
    text: Climate Action Tracker rates India's overall action "Highly insufficient" (September 2026).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/india/
  - label: Recent
    text: Non-fossil sources reached 50% of installed power capacity in July 2025, five years ahead of target. A carbon credit trading scheme is due to start in 2026.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/india/

indonesia:
  name: Indonesia
  region: Asia
  accent: plum
  lede: Net zero by 2060, but plans to retire coal plants early are being scaled back.
  cat_url: https://climateactiontracker.org/countries/indonesia/
  cat_date: September 2026
  rating: Critically insufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Its 2035 pledge switches to a cut from a historical reference year, and its forestry and land sector aims to absorb a net 140 MtCO2e by 2030.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/indonesia/
  - label: Net zero
    text: '2060.'
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/indonesia/
  - label: Independent rating
    text: Climate Action Tracker rates Indonesia's overall action "Critically insufficient" (September 2026).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/indonesia/
  - label: Recent
    text: Its emissions trading scheme now covers coal and gas plants that supply industry directly. In late 2025 it dropped plans to retire the Cirebon-1 coal plant early.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/indonesia/

iran:
  name: Iran
  region: Middle East
  accent: teal
  lede: One of the few countries yet to ratify the Paris Agreement.
  cat_url: https://climateactiontracker.org/countries/iran/
  cat_date: October 2023
  rating: Critically insufficient
  checked: November 2026
  facts:
  - label: Paris Agreement
    text: Not yet ratified.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/iran/
  - label: Pledge (NDC)
    text: A 2015 pledge to cut emissions 4% below business as usual by 2030, or 12% with support. CAT says both are inflated and will be met anyway.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/iran/
  - label: Net zero
    text: None.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/iran/
  - label: Independent rating
    text: Climate Action Tracker rates Iran's overall action "Critically insufficient" (October 2023).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/iran/
  - label: Recent
    text: Its development plan for 2023 to 2027 contains no measures to cut emissions and no renewable energy targets.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/iran/

japan:
  name: Japan
  region: Asia
  accent: plum
  lede: Net zero by 2050, with plans for a new generation of nuclear reactors.
  cat_url: https://climateactiontracker.org/countries/japan/
  cat_date: November 2024
  rating: Insufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Cut emissions 46% below 2013 levels by 2030, aiming for 50%.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/japan/
  - label: Net zero
    text: '2050.'
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/japan/
  - label: Independent rating
    text: Climate Action Tracker rates Japan's overall action "Insufficient" (November 2024).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/japan/
  - label: Recent
    text: Its GX policy includes new-generation nuclear reactors, but CAT says it lacks concrete emissions targets. A 2035 pledge was being drafted at the time of CAT's assessment.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/japan/

kazakhstan:
  name: Kazakhstan
  region: Asia
  accent: plum
  lede: Net zero by 2060 is in law, while new coal power is planned.
  cat_url: https://climateactiontracker.org/countries/kazakhstan/
  cat_date: January 2024
  rating: Insufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Cut emissions 15% below 1990 levels by 2030, or 25% with international support.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/kazakhstan/
  - label: Net zero
    text: 2060, set in law in 2023.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/kazakhstan/
  - label: Independent rating
    text: Climate Action Tracker rates Kazakhstan's overall action "Insufficient" (January 2024).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/kazakhstan/
  - label: Recent
    text: Its 2023 pledge update did not raise ambition, and new coal power was announced at the end of 2022. CAT projects emissions to keep growing until 2035 under current policies.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/kazakhstan/

kenya:
  name: Kenya
  region: Africa
  accent: mustard
  lede: Aiming for 100% clean electricity by 2030.
  cat_url: https://climateactiontracker.org/countries/kenya/
  cat_date: March 2026
  rating: Almost sufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Cut emissions 35% below business as usual by 2035 (submitted April 2025).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/kenya/
  - label: Net zero
    text: No target.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/kenya/
  - label: Independent rating
    text: Climate Action Tracker rates Kenya's overall action "Almost sufficient" (March 2026).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/kenya/
  - label: Recent
    text: Its National Energy Compact for 2025 to 2030 aims for 100% clean power generation by 2030. Wind and solar provided around 18% of electricity in 2024.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/kenya/

mexico:
  name: Mexico
  region: Americas
  accent: orange
  lede: A new 2035 pledge, alongside plans to raise oil and gas output.
  cat_url: https://climateactiontracker.org/countries/mexico/
  cat_date: February 2026
  rating: Highly insufficient
  checked: November 2026
  facts:
  - label: Pledge (NDC)
    text: Cut emissions 30% below business as usual by 2030, or up to 40% with support. A 2035 pledge with absolute targets was submitted at COP30.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/mexico/
  - label: Net zero
    text: 2050, announced at COP29. Not in law.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/mexico/
  - label: Independent rating
