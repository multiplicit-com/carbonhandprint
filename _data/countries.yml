uk:
  name: United Kingdom
  owid: united-kingdom
  region: Europe
  accent: blue
  lede: The first major economy to put net zero by 2050 into law, now aiming for clean power by 2030.
  cat_url: https://climateactiontracker.org/countries/uk/
  cat_date: October 2025
  rating: Insufficient
  checked: November 2026
  facts:
  - label: Paris Agreement
    text: A party since 2016.
  - label: Pledge (NDC)
    text: Cut emissions 81% below 1990 levels by 2035, and at least 68% by 2030.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/uk/
  - label: Net zero
    text: 2050, set in law in 2019.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/uk/
  - label: Independent rating
    text: Climate Action Tracker rates the UK's overall action "Insufficient" (October 2025).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/uk/
  - label: Recent
    text: The Clean Power 2030 plan targets 95% low-carbon electricity by 2030, and the UK is linking its emissions trading scheme with the EU's. Overseas aid, which funds climate finance, has been cut from 0.5% to 0.3% of national income.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/uk/
  timeline:
  - when: November 2008
    date: 2008-11
    text: The Climate Change Act becomes law, with a binding target to cut emissions at least 80% below 1990 levels by 2050.
    source: LSE Grantham Research Institute
    url: https://www.lse.ac.uk/granthaminstitute/publication/the-climate-change-act/
  - when: June 2019
    date: 2019-06
    text: Becomes the first major economy to set net zero by 2050 in law.
    source: GOV.UK
    url: https://www.gov.uk/government/news/uk-becomes-first-major-economy-to-pass-net-zero-emissions-law
  - when: '2030'
    date: 2030-12
    text: Cut emissions at least 68% below 1990 levels.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/uk/
    upcoming: true
  - when: '2035'
    date: 2035-12
    text: Cut emissions 81% below 1990 levels.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/uk/
    upcoming: true
  - when: '2050'
    date: 2050-12
    text: Net zero, set in law.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/uk/
    upcoming: true
  - when: November 2021
    date: 2021-11
    text: Hosts COP26 in Glasgow, which agrees the Glasgow Climate Pact.
    source: Carbon Brief
    url: https://www.carbonbrief.org/cop26-key-outcomes-agreed-at-the-un-climate-talks-in-glasgow/
    page: /events/cop26/

us:
  name: United States
  owid: united-states
  region: Americas
  accent: orange
  lede: The world's second-largest emitter has left the Paris Agreement and rolled back much of its federal climate policy.
  cat_url: https://climateactiontracker.org/countries/usa/
  cat_date: October 2026
  rating: Critically insufficient
  checked: November 2026
  facts:
  - label: Paris Agreement
    text: Withdrawal ordered on 20 January 2025 and in effect from 27 January 2026. The administration has also announced it will leave the UN climate convention (UNFCCC).
    source: Harvard EELP
    url: https://eelp.law.harvard.edu/tracker/paris-climate-agreement
  - label: Pledge (NDC)
    text: None in force. The 2030 and 2035 pledges made in 2021 and 2024 have been withdrawn.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/usa/
  - label: Net zero
    text: No federal target. 19 states are pursuing net zero on their own.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/usa/
  - label: Independent rating
    text: Climate Action Tracker rates US action "Critically insufficient" (October 2026).
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/usa/
  - label: Recent
    text: The One Big Beautiful Bill Act (July 2025) removed much of the Inflation Reduction Act's clean energy support. In February 2026 the EPA overturned the 2009 finding that greenhouse gases endanger public health, the legal basis for federal emissions rules.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/usa/
  timeline:
  - when: January 2025
    date: 2025-01
    text: A presidential order begins withdrawal from the Paris Agreement for the second time.
    source: Harvard EELP
    url: https://eelp.law.harvard.edu/tracker/paris-climate-agreement
  - when: July 2025
    date: 2025-07
    text: The One Big Beautiful Bill Act removes much of the Inflation Reduction Act's clean energy support.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/usa/
  - when: January 2026
    date: 2026-01
    text: Withdrawal from the Paris Agreement takes effect on 27 January.
    source: Harvard EELP
    url: https://eelp.law.harvard.edu/tracker/paris-climate-agreement
  - when: February 2026
    date: 2026-02
    text: The EPA overturns the 2009 finding that greenhouse gases endanger public health.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/usa/
  - when: September 2026
    date: 2026-09
    text: The EPA overturns the 2024 emissions standards for fossil fuel power plants.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/usa/
  - when: September 2016
    date: 2016-09
    text: President Obama formally brings the US into the Paris Agreement, alongside China.
    source: Obama White House archive
    url: https://obamawhitehouse.archives.gov/blog/2016/09/03/president-obama-united-states-formally-enters-paris-agreement
  - when: June 2017
    date: 2017-06
    text: President Trump announces the US will withdraw from the Paris Agreement.
    source: PBS NewsHour
    url: https://www.pbs.org/newshour/nation/president-trump-pulls-u-s-paris-accord-sparking-global-criticism
  - when: November 2020
    date: 2020-11
    text: The first withdrawal takes effect on 4 November.
    source: AP
    url: https://www.opb.org/article/2020/11/04/us-exit-paris-climate-pact
  - when: February 2021
    date: 2021-02
    text: Rejoins the Paris Agreement on 19 February, under President Biden.
    source: NPR
    url: https://www.npr.org/2021/02/19/969387323/u-s-officially-rejoins-paris-agreement-on-climate-change
  - when: August 2022
    date: 2022-08
    text: The Inflation Reduction Act is signed, with about $369 billion for climate and clean energy.
    source: Biden White House archive
    url: https://bidenwhitehouse.archives.gov/briefing-room/speeches-remarks/2022/08/16/remarks-by-president-biden-at-signing-of-h-r-5376-the-inflation-reduction-act-of-2022

