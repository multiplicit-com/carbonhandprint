    url: https://climateactiontracker.org/countries/vietnam/
  - when: '2030'
    date: 2030-12
    text: Limit emissions to about 878 MtCO2e, or 629 MtCO2e with support.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/vietnam/
    upcoming: true
  - when: '2050'
    date: 2050-12
    text: Net zero, conditional on international finance.
    source: Climate Action Tracker
    url: https://climateactiontracker.org/countries/vietnam/
    upcoming: true
