  url: https://www.wbcsd.org/Imperatives/Climate-Action/Resources/Guidance-on-Avoided-Emissions
  note: The World Business Council for Sustainable Development's method for measuring and disclosing "avoided emissions", the corporate world's closest equivalent to a carbon handprint.
  group: Methods and guidance
- title: "L.1480: Enabling the Net Zero transition"
  publisher: ITU-T
  date: "2025-07"
  url: https://www.itu.int/rec/T-REC-L.1480/en
  note: The UN telecoms agency's standard for assessing how digital technology changes the emissions of other sectors.
  group: Methods and guidance
- title: "Handprint-Based NetPositive Assessment"
  publisher: Gregory Norris, Harvard T.H. Chan School of Public Health
  date: "2015-11"
