# White papers, reports and standards. Grouped by `group`, newest first within each group.
# Fields: title, publisher, date (YYYY-MM, or YYYY), url, note, group.
- title: "Carbon handprint guide, V. 2.0: applicable for environmental handprint"
  publisher: VTT and LUT University
  date: "2021"
  url: https://publications.vtt.fi/julkaisut/muut/2021/Carbon_handprint_guide_2021.pdf
  note: The current step-by-step method for calculating and communicating a product's handprint, as the footprint difference between a baseline and the offered solution.
  group: Methods and guidance
- title: "Carbon Handprint Guide (first edition)"
  publisher: VTT and LUT University
  date: "2018"
  url: https://sarjaweb.vtt.fi/julkaisut/muut/2018/Carbon_Handprint_Guide.pdf
  note: The original 10-step procedure, defining a carbon handprint as the emissions cut a customer achieves by using a product instead of a baseline.
  group: Methods and guidance
- title: "Guidance on Avoided Emissions v2.0"
  publisher: WBCSD
