---
layout: default
---
<article class="wrap prose c-{{ page.accent | default: 'orange' }}">
  <p class="meta"><a href="{{ '/blog/' | relative_url }}">Blog</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
  <h1>{{ page.title }}</h1>
  {{ content }}
  <hr>
  <p class="meta">Shared under <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a>. Spotted something we should cover? <a href="{{ '/about/#get-in-touch' | relative_url }}">Get in touch</a>.</p>
</article>
