---
layout: default
---
{% assign a = site.data.authors[page.author_key] %}
<article class="wrap prose c-plum">
  <h1>{{ a.name }}</h1>
  {% if a.bio %}<p class="lede">{{ a.bio }}</p>{% endif %}
  {% assign mine = site.posts | where: "author", page.author_key %}
  <ul class="postlist">
  {% for post in mine %}{% include postitem.html post=post %}
  {% endfor %}</ul>
</article>
