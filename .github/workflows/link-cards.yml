name: Link cards

# Fills in card images for news links. Runs only when _news/ changes.
on:
  push:
    branches: [main]
    paths: ["_news/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: link-cards

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sharing images
        run: python3 tools/og.py _news/*.md
      - name: Commit any changes
        run: |
          if git diff --quiet; then echo "Nothing to update"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -am "Add link card images"
          git push
          # Pushes made by this workflow don't start a Pages build on their own
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
