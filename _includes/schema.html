{%- assign base = '/' | absolute_url -%}
{%- assign pageurl = page.url | absolute_url -%}
{%- assign ptype = page.schema_type | default: "WebPage" -%}
{%- if page.collection == "posts" %}{% assign ptype = "WebPage" %}{% endif -%}
<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
{"@type":"Organization","@id":"{{ base }}#org","name":{{ site.title | jsonify }},"url":"{{ base }}","logo":{"@type":"ImageObject","url":{{ site.logo | absolute_url | jsonify }}},"foundingDate":"2007","sameAs":{{ site.social.links | jsonify }}},
{"@type":"WebSite","@id":"{{ base }}#website","name":{{ site.title | jsonify }},"url":"{{ base }}","inLanguage":"{{ site.lang }}","publisher":{"@id":"{{ base }}#org"},"description":{{ site.description | strip | jsonify }}},
{"@type":{{ ptype | jsonify }},"@id":"{{ pageurl }}#webpage","url":"{{ pageurl }}","name":{{ page.title | default: site.title | jsonify }},"isPartOf":{"@id":"{{ base }}#website"},"inLanguage":"{{ site.lang }}"{% if page.description %},"description":{{ page.description | strip | jsonify }}{% endif %}
{%- if page.url != "/" %},"breadcrumb":{"@id":"{{ pageurl }}#breadcrumb"}{% endif %}
{%- if page.layout == "country" %}{% assign c = site.data.countries[page.country] %},"about":{"@type":"{% if page.country == "eu" %}Organization{% else %}Country{% endif %}","name":{{ c.name | jsonify }}}{% endif %}
{%- if page.layout == "cop" %}{% assign ev = site.data.events | where: "slug", page.event | first %}{% assign evc = site.data.countries[ev.country] %},"mainEntity":{"@type":"Event","name":{{ ev.name | append: ", UN Climate Change Conference" | jsonify }},"startDate":"{{ ev.start | date: '%Y-%m-%d' }}","endDate":"{{ ev.end | date: '%Y-%m-%d' }}","eventStatus":"https://schema.org/EventScheduled","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","description":{{ ev.text | strip | jsonify }},"location":{"@type":"Place","name":{{ ev.place | jsonify }}{% if evc %},"address":{"@type":"PostalAddress","addressLocality":{{ ev.city | default: ev.place | split: ',' | first | jsonify }},"addressCountry":{{ evc.name | jsonify }}}{% endif %}},"organizer":{"@type":"Organization","name":"United Nations Framework Convention on Climate Change","url":"https://unfccc.int/"}}{% endif %}
{%- if page.layout == "author" %}{% assign a = site.data.authors[page.author_key] %},"mainEntity":{"@type":"Person","@id":"{{ pageurl }}#person","name":{{ a.name | jsonify }},"url":"{{ pageurl }}"{% if a.bio %},"description":{{ a.bio | jsonify }}{% endif %},"worksFor":{"@id":"{{ base }}#org"}}{% endif %}
{%- if page.defined_term %},"mainEntity":{"@type":"DefinedTerm","name":{{ page.defined_term | jsonify }},"description":{{ page.lede | strip | jsonify }},"url":"{{ pageurl }}","inDefinedTermSet":{"@type":"DefinedTermSet","name":"Carbon Handprint glossary","url":"{{ pageurl }}"}}{% endif %}
{%- if page.item_list %},"mainEntity":{"@type":"ItemList","itemListElement":[
{%- case page.item_list -%}
{%- when "news" -%}{% assign items = site.news | sort: "date" | reverse %}{% for n in items %}{"@type":"ListItem","position":{{ forloop.index }},"item":{"@type":"{% if n.snippet %}CreativeWork{% else %}NewsArticle{% endif %}","name":{{ n.title | jsonify }},"url":{{ n.link | jsonify }},"datePublished":"{{ n.date | date: '%Y-%m-%d' }}"{% if n.source %},"publisher":{"@type":"Organization","name":{{ n.source | jsonify }}}{% endif %}}}{% unless forloop.last %},{% endunless %}{% endfor %}
{%- when "archive" -%}{% for p in site.posts %}{"@type":"ListItem","position":{{ forloop.index }},"url":"{{ p.url | absolute_url }}","name":{{ p.title | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}
{%- when "reading" -%}{% for r in site.data.reading %}{"@type":"ListItem","position":{{ forloop.index }},"item":{"@type":{{ r.kind | default: "CreativeWork" | jsonify }},"name":{{ r.title | jsonify }},"url":{{ r.url | jsonify }}}}{% unless forloop.last %},{% endunless %}{% endfor %}
{%- when "whitepapers" -%}{% for d in site.data.whitepapers %}{"@type":"ListItem","position":{{ forloop.index }},"item":{"@type":"{% if d.group == 'Research reports' %}ScholarlyArticle{% else %}Report{% endif %}","name":{{ d.title | jsonify }},"url":{{ d.url | jsonify }}{% if d.publisher %},"publisher":{"@type":"Organization","name":{{ d.publisher | jsonify }}}{% endif %}{% if d.date != "" %},"datePublished":{{ d.date | slice: 0, 4 | jsonify }}{% endif %}}}{% unless forloop.last %},{% endunless %}{% endfor %}
{%- when "countries" -%}{% assign cs = site.data.countries | sort %}{% for c in cs %}{"@type":"ListItem","position":{{ forloop.index }},"url":"{{ '/countries/' | append: c[0] | append: '/' | absolute_url }}","name":{{ c[1].name | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}
{%- endcase -%}]}{% endif %}}
{%- if page.url != "/" %},
{"@type":"BreadcrumbList","@id":"{{ pageurl }}#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"{{ base }}"}
{%- if page.collection == "posts" %},{"@type":"ListItem","position":2,"name":"Articles","item":"{{ '/articles/' | absolute_url }}"},{"@type":"ListItem","position":3,"name":{{ page.title | jsonify }}}
{%- elsif page.layout == "cop" %},{"@type":"ListItem","position":2,"name":"Climate talks","item":"{{ '/events/' | absolute_url }}"},{"@type":"ListItem","position":3,"name":{{ page.title | jsonify }}}
{%- elsif page.layout == "country" %},{"@type":"ListItem","position":2,"name":"Paris Agreement","item":"{{ '/paris-agreement/' | absolute_url }}"},{"@type":"ListItem","position":3,"name":{{ page.title | jsonify }}}
{%- else %},{"@type":"ListItem","position":2,"name":{{ page.title | jsonify }}}{% endif %}]}
{%- endif %}
]}
</script>
