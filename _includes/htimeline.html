{% assign tl = include.items | sort: "date" %}<div class="htl">
  <ol class="htl-track" tabindex="0" aria-label="{{ include.label | default: 'Timeline' }}">
  {% for t in tl %}<li data-date="{{ t.date }}"{% if t.upcoming %} class="up"{% endif %}><span class="yr">{{ t.when }}{% if t.upcoming %} <span class="up-tag">· upcoming</span>{% endif %}</span><span class="tx">{% if t.page %}<a href="{{ t.page | relative_url }}">{{ t.text }}</a>{% else %}{{ t.text }}{% endif %}</span></li>
  {% endfor %}</ol>
  <p class="htl-nav" hidden><button type="button" data-dir="-1">Earlier</button> <button type="button" data-dir="1">Later</button></p>
</div>
