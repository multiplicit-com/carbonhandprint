{% assign rel = site.posts | where_exp: "p", "p.tags contains include.tag" %}{% if rel.size > 0 %}
<section class="related">
<h2>{{ include.title | default: "Related articles" }}</h2>
<ul class="postlist">
{% for post in rel %}{% include postitem.html post=post %}
{% endfor %}</ul>
</section>{% endif %}
